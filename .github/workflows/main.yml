name: Build APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake python3-setuptools
          pip3 install --user --upgrade pip buildozer kivy opencv-python numpy cython

      - name: Build APK with Buildozer
        run: |
          export PATH=$PATH:~/.local/bin
          yes y | buildozer android debug
